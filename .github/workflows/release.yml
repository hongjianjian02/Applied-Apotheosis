name: Release

# 打 tag（形如 v1.0.0）时自动构建，并把 mod jar 挂到 GitHub Release 上。
# 也可以在 GitHub 网页上「Create a new release」里新建 tag，本工作流会把 jar 补传上去。
#
# ⚠️ 手动运行（workflow_dispatch）时必须填一个**已存在的版本 tag**：早期版本会直接拿
# github.ref_name 当 tag 名，于是「在 main 分支上手动跑一次」就凭空造出一个名为 main 的
# tag，之后 git push origin main 会报 "src refspec main matches more than one"。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（形如 v1.0.0，需已存在）。分支名会被拒绝。'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 只接受 v 开头的版本 tag，避免把分支名（main 等）做成 tag
      - name: Resolve the tag to publish
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *)
              echo "::error::'$TAG' 不是版本 tag（要形如 v1.0.0）。手动运行请填一个已有的 tag；分支名一律拒绝，否则会造出同名 tag 让 git push 报 'src refspec ... matches more than one'。"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publishing ${TAG}"

      # 防止 tag 与 gradle.properties 里的 mod_version 不一致
      - name: Check tag matches mod_version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          echo "tag=${TAG}  mod_version=v${VERSION}"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} 与 gradle.properties 的 mod_version=v${VERSION} 不一致"
            exit 1
          fi

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Show artefacts
        run: ls -l build/libs

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          gh release upload "${TAG}" build/libs/*.jar --clobber
