name: Release

# 打 tag（形如 v1.0.0）时自动构建，并把 mod jar 挂到 GitHub Release 上。
# 也可以在 GitHub 网页上「Create a new release」里新建 tag，本工作流会把 jar 补传上去。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 防止 tag 与 gradle.properties 里的 mod_version 不一致
      - name: Check tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          echo "tag=${GITHUB_REF_NAME}  mod_version=v${VERSION}"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 gradle.properties 的 mod_version=v${VERSION} 不一致"
            exit 1
          fi

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Show artefacts
        run: ls -l build/libs

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${TAG}" ]; then
            echo "::error::workflow_dispatch 运行时请指定一个 tag 引用（ref）"
            exit 1
          fi
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          gh release upload "${TAG}" build/libs/*.jar --clobber
