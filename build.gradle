plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.21.1 runs on Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoForge_version

    // Run configurations, mirroring the Forge ones:
    //   gradlew runServer -Pselftest        -> server self-test (assertions, non-zero exit on failure)
    //   gradlew runClient -Pclientselftest  -> opens the GUI in a quick-play world and screenshots it
    runs {
        client {
            client()
            if (project.hasProperty('clientselftest')) {
                systemProperty 'applied_apotheosis.clientselftest', 'true'
                programArguments.addAll '--quickPlaySingleplayer', 'selftest'
            }
        }
        server {
            server()
            programArgument '--nogui'
            if (project.hasProperty('selftest')) {
                systemProperty 'applied_apotheosis.selftest', 'true'
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // AE2 19.x (NeoForge) is published on the Modrinth maven, pinned by version id.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // Apotheosis, Placebo and ApothicAttributes.
    maven {
        name = 'ShadowsMaven'
        url = 'https://maven.shadowsoffire.dev/releases'
        content {
            includeGroup 'dev.shadowsoffire'
        }
    }
    // GuideME lives on Maven Central.
    mavenCentral()
}

dependencies {
    implementation "maven.modrinth:ae2:${ae2_maven_version}"
    // GuideME is a mandatory dependency of AE2 19.x
    implementation "org.appliedenergistics:guideme:${guideme_version}"

    // Apotheosis and its mandatory dependencies. Its optional integrations (Curios, Patchouli,
    // Gateways, Apothic Spawners/Enchanting) are excluded: their POMs are not on the mavens we
    // declare, and a dev environment does not need them.
    implementation("dev.shadowsoffire:Apotheosis:${apotheosis_version}") {
        exclude group: 'top.theillusivec4.curios'
        exclude group: 'vazkii.patchouli'
        exclude group: 'dev.shadowsoffire.apothic_spawners'
        exclude group: 'dev.shadowsoffire.apothic_enchanting'
    }
    implementation("dev.shadowsoffire:Placebo:${placebo_version}") {
        exclude group: 'top.theillusivec4.curios'
        exclude group: 'vazkii.patchouli'
    }
    implementation("dev.shadowsoffire:ApothicAttributes:${apothic_attributes_version}") {
        exclude group: 'top.theillusivec4.curios'
        exclude group: 'vazkii.patchouli'
    }
}

// Expand the properties declared in gradle.properties into the mod metadata.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoForge_version       : neoForge_version,
            neoForge_version_range : neoForge_version_range,
            loader_version_range   : loader_version_range,
            ae2_version_range      : ae2_version_range,
            guideme_version_range  : guideme_version_range,
            apotheosis_version_range: apotheosis_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
