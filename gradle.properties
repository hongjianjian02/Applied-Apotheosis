# 1.21.1 / NeoForge port of Applied Apotheosis.
# Keep this file ASCII-only: Gradle reads properties as ISO-8859-1, so non-ASCII text would be
# mangled into the mod metadata and show up as ???? in the mod list.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neoForge_version=21.1.251
neoForge_version_range=[21.1.235,)
loader_version_range=[4,)

# Mod
mod_id=applied_apotheosis
mod_name=Applied Apotheosis
mod_license=MIT
mod_version=1.0.3
mod_group_id=com.jianjian.appliedapotheosis
mod_authors=jianjian_
mod_description=An Applied Energistics 2 addon that salvages Apotheosis affix equipment and gems into materials and feeds them straight into the ME network.

# Dependencies for 1.21.1
# AE2 ships 19.x for NeoForge on the Modrinth maven (pinned by version id).
ae2_version=19.2.17
ae2_version_range=[19.2.0,)
ae2_maven_version=kfyIqgJ6
guideme_version=21.1.19
guideme_version_range=[21.1.1,)
apotheosis_version=1.21.1-8.8.0
apotheosis_version_range=[1.21.1-7.4.0,)
placebo_version=1.21.1-9.9.2
apothic_attributes_version=1.21.1-2.10.1
curios_version=9.5.1+1.21.1
patchouli_version=1.21-87-NEOFORGE
